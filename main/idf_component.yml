version: "1.0.0"
description: "YMOS voice assistant for ESP-VoCat v1.2 with touchscreen settings"

dependencies:
  # Core ESP-IDF
  idf:
    version: ">=6.1.0,<6.2.0"

  # Audio codec abstraction (ES7210 ADC + ES8311 DAC)
  espressif/esp_codec_dev:
    version: "^1.6.2"

  # Wake word detection (WakeNet) + AFE VAD pipeline
  # 注意：esp-sr 需要在 menuconfig 中配置模型路径
  #   -> Component config -> ESP Speech Recognition -> Select wake words
  #     常用模型：wn9_hilexin（你好小E）/ wn9_hiesp（你好小智）
  espressif/esp-sr:
    version: ">=2.5.3"

  # 保持本轮已验证的音频推理依赖，增加 UI 时不顺带升级。
  espressif/esp-dl:
    version: "3.3.13"

  # WebSocket 客户端（IDF 6.1 继续作为独立组件使用）
  # 注意：组件名是 esp_websocket_client（下划线），不是 esp-websocket-client（连字符）
  espressif/esp_websocket_client:
    version: "^1.8.0"

  # 显示驱动和纯 C 图形库；版本固定以便复现与验证升级。
  espressif/esp_lcd_st77916:
    version: "2.0.2"
  lvgl/lvgl:
    version: "9.5.0"
